# Pulls the image zot only serves to an exchange-minted identity.
#
# Nothing here fetches a credential. kubelet does it: on seeing an image matching
# zot.production.other it runs the image credential provider on the node, which combines
# this pod's service account token with the node's own SVID from the host spire-ha-agent
# and trades them at the exchange for a registry token. Completing at all is the
# assertion, since zot rejects anything else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zot-pull
---
apiVersion: batch/v1
kind: Job
metadata:
  name: image-pull
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: image-pull
    spec:
      serviceAccountName: zot-pull
      restartPolicy: Never
      containers:
      - name: main
        image: zot.production.other/test/busybox:latest
        # Force the credential provider to run again on the failover re-pull rather than
        # letting kubelet serve the image from the node's cache.
        imagePullPolicy: Always
        command: ["sh", "-c", "echo IMAGE-PULL-OK"]
