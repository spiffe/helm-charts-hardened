# A plain http workload wrapped by ghostunnel so it is only reachable over SPIFFE mTLS.
# nginx listens on loopback only; ghostunnel terminates mTLS with an SVID from the spire-ha-agent
# and only lets the Envoy Gateway proxy's identity through.
#
# ENVOY_SPIFFE_ID is substituted by run-tests.sh. Envoy Gateway generates the proxy's service
# account name, so the id is only known once the Gateway exists.
apiVersion: v1
kind: Pod
metadata:
  name: hello-world
  namespace: default
  labels:
    app: hello-world
spec:
  containers:
  - name: nginx
    image: nginx
    command:
    - /bin/sh
    - -c
    - |
      cat > /etc/nginx/conf.d/default.conf <<EOF
      server {
          listen       127.0.0.1:8080;
          server_name  localhost;
          location / {
              root   /usr/share/nginx/html;
              index  index.html index.htm;
          }
      }
      EOF
      echo hello world > /usr/share/nginx/html/index.html
      exec nginx -g "daemon off;"
  - name: ghostunnel
    image: ghostunnel/ghostunnel:v1.7.2
    command:
    - ghostunnel
    - server
    - --use-workload-api-addr
    - unix:/spire-workload-api/spire-agent.sock
    - --listen
    - 0.0.0.0:8443
    - --target
    - localhost:8080
    - --allow-uri
    - ENVOY_SPIFFE_ID
    volumeMounts:
    - name: agent
      mountPath: /spire-workload-api
      readOnly: true
    ports:
    - containerPort: 8443
  volumes:
  - name: agent
    csi:
      driver: csi.spiffe.io
      readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: hello-world
  namespace: default
spec:
  selector:
    app: hello-world
  ports:
  - protocol: TCP
    port: 8443
    targetPort: 8443
