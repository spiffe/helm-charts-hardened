# The host spire-ha-agent. It merges the two root agents into one workload API, so host
# services keep their identity when a single root server goes away. The packaged agent
# config lists this SPIFFE ID in authorized_delegates, so the ID has to match exactly.
# Federating with spire-ha gives it the other side's authorities, matching how the
# in-cluster ha-agent entry is defined.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterStaticEntry
metadata:
  name: node1-spire-ha-agent
spec:
  parentID: spiffe://${SPIFFE_TRUST_DOMAIN}/agent/node1
  spiffeID: spiffe://${SPIFFE_TRUST_DOMAIN}/spire-ha-agent
  selectors:
  - systemd:id:spire-ha-agent@main.service
  federatesWith:
  - spire-ha
