# Per node identity for kubelet itself. Nothing consumes this yet; it is here so kubelet
# can be given its own identity later without disturbing the image pull one. The plugin
# selects between the two entries on this bridge by hint.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterStaticEntry
metadata:
  name: node3-kubelet
spec:
  parentID: spiffe://${SPIFFE_TRUST_DOMAIN}/agent/node1
  spiffeID: spiffe://${SPIFFE_TRUST_DOMAIN}/kubelet/node3.${SPIFFE_TRUST_DOMAIN}
  hint: kubelet
  selectors:
  - systemd:id:spiffe-socat-unix@k8s-kubelet-3.service
