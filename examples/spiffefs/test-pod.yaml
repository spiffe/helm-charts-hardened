apiVersion: v1
kind: Pod
metadata:
  name: spiffefs-test
  labels:
    spiffefs.test/colocate: "true"
spec:
  terminationGracePeriodSeconds: 1
  affinity:
    # Both test pods share a node. Tearing one down must leave the other, and the
    # node's spiffefs mount, untouched, which can only be seen on one node.
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              spiffefs.test/colocate: "true"
          topologyKey: kubernetes.io/hostname
  containers:
    - name: main
      image: busybox
      # Exits when /tmp/exit appears, so the test can restart the container in
      # place without replacing the pod.
      command: ["/bin/sh", "-c", "while [ ! -e /tmp/exit ]; do sleep 1; done"]
      volumeMounts:
        - name: spiffefs
          mountPath: /spiffe
          readOnly: true
          # Required so the pod picks up spiffefs remounting on restart
          # instead of holding a stale mount.
          mountPropagation: HostToContainer
  volumes:
    - name: spiffefs
      csi:
        driver: spiffefs.csi.spiffe.io
        readOnly: true
