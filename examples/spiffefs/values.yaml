spiffefs:
  enabled: true

spire-server:
  controllerManager:
    identities:
      clusterSPIFFEIDs:
        # Two identities for the late test pod. Two svids on one workload is
        # what exercises the indexed file names and the hint mapping in
        # hints.json.
        #
        # Both have to be explicit. The chart's stock "default" identity is a
        # fallback, so it is replaced rather than added to the moment any other
        # identity matches a pod: relying on it for one of the two would leave
        # the workload with a single svid.
        spiffefs-multi-main:
          enabled: true
          spiffeIDTemplate: spiffe://{{ .TrustDomain }}/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}
          hint: multi-main
          podSelector:
            matchLabels:
              spiffefs.test/multi-svid: "true"
        spiffefs-multi-extra:
          enabled: true
          spiffeIDTemplate: spiffe://{{ .TrustDomain }}/spiffefs-test/extra
          hint: extra
          podSelector:
            matchLabels:
              spiffefs.test/multi-svid: "true"

spire-agent:
  sockets:
    admin:
      # spiffefs talks the Delegated Identity API to the agent's admin socket,
      # and reaches it through the host, so the agent has to publish it there.
      enabled: true
      mountOnHost: true
