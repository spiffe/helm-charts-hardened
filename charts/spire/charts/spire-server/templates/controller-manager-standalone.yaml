{{- if not .Values.externalServer }}
{{- if and (eq (.Values.controllerManager.enabled | toString) "true") (eq .Values.controllerManager.deploymentMode "standalone") }}
{{- $webhooksEnabled := .Values.controllerManager.validatingWebhookConfiguration.enabled }}
{{- $agentSocketPath := include "spire-controller-manager.standalone-agent-socket-path" . }}
{{- $attestorCluster := include "spire-controller-manager.standalone-attestor-cluster-name" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "spire-controller-manager.standalone-serviceAccountName" . }}
  namespace: {{ include "spire-server.namespace" . }}
  labels:
    {{- include "spire-controller-manager.standalone-labels" . | nindent 4 }}
  {{- with .Values.controllerManager.standalone.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
# Config for the standalone Deployment's own in-pod spire-agent sidecar.
# This agent attests as a distinct k8s_psat "node", scoped to just this
# Deployment's own ServiceAccount (see the dedicated cluster profile in
# configmap.yaml) and identified by its own Pod's UID
# (use_pod_uid_for_agent_id), rather than depending on the per-node
# spiffe-csi-driver/agent DaemonSet or any chicken-and-egg
# registration-entry bootstrapping: the node-alias and workload entries
# below are fully static, so they exist before this Pod is ever
# scheduled.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spire-controller-manager.standalone-fullname" . }}-agent
  namespace: {{ include "spire-server.namespace" . }}
  labels:
    {{- include "spire-controller-manager.standalone-labels" . | nindent 4 }}
data:
  agent.conf: |
    agent {
      data_dir = "/var/lib/spire-agent-cm"
      log_level = {{ .Values.controllerManager.standalone.agent.logLevel | quote }}
      server_address = {{ printf "%s.%s.svc.cluster.local" (include "spire-server.fullname" .) (include "spire-server.namespace" .) | quote }}
      server_port = "443"
      socket_path = {{ $agentSocketPath | quote }}
      trust_bundle_format = {{ .Values.bundlePublisher.k8sConfigMap.format | quote }}
      trust_bundle_path = {{ printf "/run/spire/bundle/bundle.%s" (include "spire-lib.trust-bundle-ext" (dict "trustBundleFormat" .Values.bundlePublisher.k8sConfigMap.format)) | quote }}
      trust_domain = {{ include "spire-lib.trust-domain" . | quote }}
    }

    plugins {
      NodeAttestor "k8s_psat" {
        plugin_data {
          cluster = {{ $attestorCluster | quote }}
        }
      }

      KeyManager "memory" {
        plugin_data {
        }
      }

      WorkloadAttestor "unix" {
        plugin_data {
          discover_workload_path = true
        }
      }
    }

    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "8080"
      live_path = "/live"
      ready_path = "/ready"
    }
---
# Bootstrap identity for the standalone controller manager Deployment,
# expressed as two fully-static registration entries (computable at Helm
# render time, with no dependency on which k8s Node the Deployment's Pod
# is ever scheduled onto - unlike the concrete pod-UID agent ID itself).
# Applied by a postStart hook on the spire-server container (see
# server-resource.yaml), which is naturally idempotent: creating an
# already-existing (parentID, spiffeID, selectors) tuple again returns
# AlreadyExists without failing the CLI/hook.
#
# 1. A "node alias" entry (parentID = spiffe://<td>/spire/server) matched
#    via k8s_psat node-attestor selectors (cluster/agent_ns/agent_sa) -
#    these selector VALUES are known ahead of time even though the
#    concrete pod-UID-based agent ID is not.
# 2. A normal admin workload entry parented to that alias, matched via
#    ordinary k8s workload-attestor selectors (ns/sa), granting the
#    standalone Deployment's own SPIFFE ID admin rights on the Server.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spire-controller-manager.standalone-fullname" . }}-bootstrap-entries
  namespace: {{ include "spire-server.namespace" . }}
  labels:
    {{- include "spire-controller-manager.standalone-labels" . | nindent 4 }}
data:
  entries.json: |
    {
      "entries": [
        {
          "parent_id": {{ printf "spiffe://%s/spire/server" (include "spire-lib.trust-domain" .) | quote }},
          "selectors": [
            {
              "type": "k8s_psat",
              "value": {{ printf "cluster:%s" $attestorCluster | quote }}
            },
            {
              "type": "k8s_psat",
              "value": {{ printf "agent_ns:%s" (include "spire-server.namespace" .) | quote }}
            },
            {
              "type": "k8s_psat",
              "value": {{ printf "agent_sa:%s" (include "spire-controller-manager.standalone-serviceAccountName" .) | quote }}
            }
          ],
          "spiffe_id": {{ include "spire-controller-manager.standalone-alias-id" . | quote }}
        },
        {
          "admin": true,
          "parent_id": {{ include "spire-controller-manager.standalone-alias-id" . | quote }},
          "selectors": [
            {
              "type": "unix",
              "value": {{ printf "uid:%d" (int .Values.controllerManager.standalone.podSecurityContext.runAsUser) | quote }}
            }
          ],
          "spiffe_id": {{ include "spire-controller-manager.standalone-workload-id" . | quote }}
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spire-controller-manager.standalone-fullname" . }}
  namespace: {{ include "spire-server.namespace" . }}
  labels:
    {{- include "spire-controller-manager.standalone-labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controllerManager.standalone.replicaCount }}
  selector:
    matchLabels:
      {{- include "spire-controller-manager.standalone-selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ (include (print $.Template.BasePath "/controller-manager-configmap.yaml") .) | sha256sum }}
        {{- with .Values.controllerManager.standalone.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "spire-controller-manager.standalone-selectorLabels" . | nindent 8 }}
        release: {{ .Release.Name }}
        release-namespace: {{ .Release.Namespace }}
        {{- with .Values.controllerManager.standalone.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with (coalesce .Values.imagePullSecrets .Values.global.imagePullSecrets) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "spire-controller-manager.standalone-serviceAccountName" . }}
      shareProcessNamespace: true
      {{- with .Values.controllerManager.standalone.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controllerManager.standalone.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controllerManager.standalone.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controllerManager.standalone.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: spire-agent
          securityContext:
            {{- include "spire-lib.securitycontext-extended" (dict "root" . "securityContext" .Values.controllerManager.standalone.agent.securityContext) | nindent 12 }}
          image: {{ template "spire-lib.image" (dict "appVersion" .Chart.AppVersion "image" .Values.controllerManager.standalone.agent.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.controllerManager.standalone.agent.image.pullPolicy }}
          args: ["-config", "/opt/spire/conf/agent/agent.conf"]
          resources:
            {{- toYaml .Values.controllerManager.standalone.agent.resources | nindent 12 }}
          volumeMounts:
            - name: agent-config
              mountPath: /opt/spire/conf/agent
              readOnly: true
            - name: spire-agent-data
              mountPath: /var/lib/spire-agent-cm
            - name: spire-agent-socket
              mountPath: {{ dir $agentSocketPath }}
            - name: spire-bundle
              readOnly: true
              mountPath: /run/spire/bundle
            - name: spire-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
        - name: spire-controller-manager
          securityContext:
            {{- include "spire-lib.securitycontext-extended" (dict "root" . "securityContext" .Values.controllerManager.standalone.securityContext) | nindent 12 }}
          image: {{ template "spire-lib.image" (dict "appVersion" .Chart.AppVersion "image" .Values.controllerManager.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.controllerManager.image.pullPolicy }}
          args:
            - --config=controller-manager-config.yaml
            {{- if .Values.controllerManager.expandEnv }}
            - --expand-env
            {{- end }}
          env:
            - name: ENABLE_WEBHOOKS
              value: {{ $webhooksEnabled | toString | quote }}
            {{- if gt (len .Values.controllerManager.extraEnv) 0 }}
            {{- .Values.controllerManager.extraEnv | toYaml | nindent 12 }}
            {{- end }}
          ports:
            {{- if $webhooksEnabled }}
            - name: https
              containerPort: 9443
              protocol: TCP
            {{- end }}
            - containerPort: 8083
              name: hp-cm
            {{- if or (dig "telemetry" "prometheus" "enabled" .Values.telemetry.prometheus.enabled .Values.global) (and (dig "spire" "recommendations" "enabled" false .Values.global) (dig "spire" "recommendations" "prometheus" true .Values.global)) }}
            - containerPort: 8082
              name: pm-cm
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: hp-cm
            {{- toYaml .Values.controllerManager.livenessProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: hp-cm
            {{- toYaml .Values.controllerManager.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.controllerManager.standalone.resources | nindent 12 }}
          volumeMounts:
            - name: spire-agent-socket
              mountPath: {{ dir $agentSocketPath }}
              readOnly: true
            - name: controller-manager-config
              mountPath: /controller-manager-config.yaml
              subPath: controller-manager-config.yaml
              readOnly: true
            - name: controller-manager-standalone-tmp
              mountPath: /tmp
              readOnly: false
      volumes:
        - name: agent-config
          configMap:
            name: {{ include "spire-controller-manager.standalone-fullname" . }}-agent
        - name: spire-agent-data
          emptyDir: {}
        - name: spire-agent-socket
          emptyDir: {}
        - name: spire-bundle
          configMap:
            name: {{ include "spire-lib.bundle-configmap" . }}
        - name: spire-token
          projected:
            sources:
              - serviceAccountToken:
                  path: spire-agent
                  expirationSeconds: 7200
                  audience: spire-server
        - name: controller-manager-config
          configMap:
            name: {{ include "spire-controller-manager.fullname" . }}
        - name: controller-manager-standalone-tmp
          emptyDir: {}
{{- if (dig "telemetry" "prometheus" "podMonitor" "enabled" .Values.telemetry.prometheus.podMonitor.enabled .Values.global) }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "spire-controller-manager.standalone-fullname" . }}
  namespace: {{ include "spire-server.podMonitor.namespace" . }}
  labels:
    {{- include "spire-controller-manager.standalone-labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "spire-controller-manager.standalone-selectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
    - port: pm-cm
  {{- if ne (include "spire-server.podMonitor.namespace" .) (include "spire-server.namespace" .) }}
  namespaceSelector:
    kubernetes.io/metadata.name: {{ include "spire-server.namespace" . }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
