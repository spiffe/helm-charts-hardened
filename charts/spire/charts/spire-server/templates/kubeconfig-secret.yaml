{{- $root := . }}
{{- $secretName := include "spire-server.kubeconfigs-secret-name" $root }}
{{- $standalone := eq $root.Values.controllerManager.deploymentMode "standalone" }}
{{/*
Per-entry set of kubeConfigs consumed by a standalone controller-manager
Deployment. Only these switch the exec plugin's kubeconfig to workload-
api mode against the standalone Pod's own in-pod agent socket; every
other consumer (nodeAttestor.externalK8sPSAT, notifier.externalK8sBundle,
bundlePublisher.externalK8sConfigMap, and sidecar-mode controller-
managers) still runs in the spire-server Pod and needs server-admin-api
mode. Refuse to render if a single entry is consumed by both, since one
Secret entry can only carry one kubeconfig.
*/}}
{{- $standaloneCMEntries := dict }}
{{- if and $standalone $root.Values.externalControllerManagers.enabled }}
{{-   $clusters := default $root.Values.kubeConfigs $root.Values.externalControllerManagers.clusters }}
{{-   range $name, $_ := $clusters }}
{{-     $clusterSettings := dict }}
{{-     if hasKey $root.Values.externalControllerManagers.clusters $name }}
{{-       $clusterSettings = index $root.Values.externalControllerManagers.clusters $name }}
{{-     end }}
{{-     $kubeConfigName := default $name (default "" $clusterSettings.kubeConfigName) }}
{{-     $_ := set $standaloneCMEntries $kubeConfigName true }}
{{-   end }}
{{- end }}
{{- $serverContainerEntries := dict }}
{{- if $root.Values.nodeAttestor.externalK8sPSAT.enabled }}
{{-   range $name, $settings := (default $root.Values.kubeConfigs $root.Values.nodeAttestor.externalK8sPSAT.clusters) }}
{{-     $kubeConfigName := $name }}
{{-     if and $settings (kindIs "map" $settings) (hasKey $settings "kubeConfigName") }}
{{-       $kubeConfigName = $settings.kubeConfigName }}
{{-     end }}
{{-     $_ := set $serverContainerEntries $kubeConfigName true }}
{{-   end }}
{{- end }}
{{- if $root.Values.notifier.externalK8sBundle.enabled }}
{{-   range $name, $settings := (default $root.Values.kubeConfigs $root.Values.notifier.externalK8sBundle.clusters) }}
{{-     $kubeConfigName := $name }}
{{-     if and $settings (kindIs "map" $settings) (hasKey $settings "kubeConfigName") }}
{{-       $kubeConfigName = $settings.kubeConfigName }}
{{-     end }}
{{-     $_ := set $serverContainerEntries $kubeConfigName true }}
{{-   end }}
{{- end }}
{{- if $root.Values.bundlePublisher.externalK8sConfigMap.enabled }}
{{-   range $name, $settings := (default $root.Values.kubeConfigs $root.Values.bundlePublisher.externalK8sConfigMap.clusters) }}
{{-     $kubeConfigName := $name }}
{{-     if and $settings (kindIs "map" $settings) (hasKey $settings "kubeConfigName") }}
{{-       $kubeConfigName = $settings.kubeConfigName }}
{{-     end }}
{{-     $_ := set $serverContainerEntries $kubeConfigName true }}
{{-   end }}
{{- end }}
{{- if not $standalone }}
{{-   if $root.Values.externalControllerManagers.enabled }}
{{-     range $name, $settings := (default $root.Values.kubeConfigs $root.Values.externalControllerManagers.clusters) }}
{{-       $kubeConfigName := $name }}
{{-       if and $settings (kindIs "map" $settings) (hasKey $settings "kubeConfigName") }}
{{-         $kubeConfigName = $settings.kubeConfigName }}
{{-       end }}
{{-       $_ := set $serverContainerEntries $kubeConfigName true }}
{{-     end }}
{{-   end }}
{{- end }}
{{- $inline := dict }}
{{- range $name, $value := .Values.kubeConfigs }}
{{-   $present := list }}
{{-   if hasKey $value "kubeConfig" }}{{ $present = append $present "kubeConfig" }}{{- end }}
{{-   if hasKey $value "kubeConfigBase64" }}{{ $present = append $present "kubeConfigBase64" }}{{- end }}
{{-   if hasKey $value "externalSecret" }}{{ $present = append $present "externalSecret" }}{{- end }}
{{-   if hasKey $value "jwtSVIDExec" }}{{ $present = append $present "jwtSVIDExec" }}{{- end }}
{{-   if ne (len $present) 1 }}
{{-     fail (printf "kubeConfigs entry %q must set exactly one of kubeConfig, kubeConfigBase64, externalSecret, or jwtSVIDExec (got: %v)" $name $present) }}
{{-   end }}
{{-   if hasKey $value "externalSecret" }}
{{-     if not $value.externalSecret.name }}
{{-       fail (printf "kubeConfigs entry %q externalSecret.name cannot be empty" $name) }}
{{-     end }}
{{-     if eq $value.externalSecret.name $secretName }}
{{-       fail (printf "kubeConfigs entry %q externalSecret.name %q is reserved for the chart-generated Secret; use a different name" $name $secretName) }}
{{-     end }}
{{-   else }}
{{-     if and (hasKey $value "jwtSVIDExec") (hasKey $standaloneCMEntries $name) (hasKey $serverContainerEntries $name) }}
{{-       fail (printf "kubeConfigs entry %q uses jwtSVIDExec and is consumed by both a standalone controller-manager (needs workload-api mode) and a spire-server-container consumer such as nodeAttestor.externalK8sPSAT/notifier.externalK8sBundle/bundlePublisher.externalK8sConfigMap (needs server-admin-api mode); split into two entries or move the server-container consumer to a non-jwtSVIDExec kubeConfig" $name) }}
{{-     end }}
{{-     $_ := set $inline $name $value }}
{{-   end }}
{{- end }}
{{- if gt (len $inline) 0 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spire-server.kubeconfigs-secret-name" $root }}
  namespace: {{ include "spire-server.namespace" $root }}
data:
  {{- range $name, $value := $inline }}
  {{- if hasKey $value "kubeConfig" }}
  {{ $name }}: {{ $value.kubeConfig | b64enc }}
  {{- else if hasKey $value "jwtSVIDExec" }}
  {{- $mode := "sidecar" }}
  {{- if hasKey $standaloneCMEntries $name }}
  {{-   $mode = "standalone" }}
  {{- end }}
  {{ $name }}: {{ include "spire-server.jwt-svid-exec-kubeconfig" (dict "jwtSVIDExec" $value.jwtSVIDExec "root" $root "mode" $mode) | b64enc }}
  {{- else }}
  {{ $name }}: {{ $value.kubeConfigBase64 | nospace }}
  {{- end }}
  {{- end }}
{{- end }}
