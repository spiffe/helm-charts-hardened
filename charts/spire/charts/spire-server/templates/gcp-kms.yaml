{{- with .Values.keyManager.gcpKMS }}
{{- if and .enabled .keyPolicy.policy }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spire-server.fullname" $ }}-gcp-kms
  namespace: {{ include "spire-server.namespace" $ }}
data:
  policy.json: |
    {{- ternary .keyPolicy.policy (toPrettyJson .keyPolicy.policy) (kindIs "string" .keyPolicy.policy) | nindent 4 }}
{{- end }}
{{- if and .enabled .serviceAccountKey.json }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spire-server.fullname" $ }}-gcp-kms
  namespace: {{ include "spire-server.namespace" $ }}
data:
  service-account.json: {{ ternary .serviceAccountKey.json (toJson .serviceAccountKey.json) (kindIs "string" .serviceAccountKey.json) | b64enc }}
{{- end }}
{{- end }}
