{{- with .Values.keyManager.awsKMS.keyPolicy.policy }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spire-server.fullname" $ }}-aws-kms
  namespace: {{ include "spire-server.namespace" $ }}
data:
  policy.json: |
    {{- ternary . (toPrettyJson .) (kindIs "string" .) | nindent 4 }}
{{- end }}
