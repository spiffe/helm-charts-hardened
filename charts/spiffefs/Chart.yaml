apiVersion: v2
name: spiffefs
description: >
  A Helm chart to install spiffefs, a FUSE filesystem that delivers SPIFFE X.509
  credentials to workloads as files.

type: application
version: 0.1.0
appVersion: "0.5.0"
keywords: ["spiffe", "spiffefs", "fuse"]
home: https://github.com/spiffe/helm-charts-hardened/tree/main/charts/spiffefs
sources:
  - https://github.com/spiffe/spiffefs
icon: https://spiffe.io/img/logos/spire/icon/color/spire-icon-color.png
maintainers:
  - name: marcofranssen
    email: marco.franssen@gmail.com
    url: https://marcofranssen.nl
  - name: kfox1111
    email: Kevin.Fox@pnnl.gov
  - name: faisal-memon
    email: fymemon@yahoo.com
kubeVersion: ">=1.21.0-0"
dependencies:
  - name: spire-lib
    repository: file://../spire-lib
    version: 0.3.1
annotations:
  org.opencontainers.image.source: https://github.com/spiffe/helm-charts-hardened
  artifacthub.io/category: security
  artifacthub.io/license: Apache-2.0
