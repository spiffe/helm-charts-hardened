# Default configuration for the spiffefs chart
# SPDX-License-Identifier: APACHE-2.0

## @skip global
global: {}

## @section spiffefs chart parameters
##

## @param image.registry The OCI registry to pull the image from
## @param image.repository The repository within the registry
## @param image.pullPolicy The image pull policy
## @param image.tag Overrides the image tag whose default is the chart appVersion
##
image:
  registry: docker.io
  repository: kfox1111/misc2
  pullPolicy: IfNotPresent
  tag: spiffefs3

## @param mountPath Host directory spiffefs mounts its filesystem on. Its parent is what the spiffe-csi-driver instance publishes, so workloads read the files one level down. The parent must match that instance's agentSocketPath directory.
mountPath: /run/spire/k8s/spiffefs/private

## @param agentSocketPath Host path to the spire-agent admin socket used for the Delegated Identity API. Requires the agent to set sockets.admin.enabled and sockets.admin.mountOnHost.
agentSocketPath: /run/spire/agent/sockets/csi.spiffe.io/admin/admin.sock

## @param updateStrategy.type The update strategy to use to replace existing DaemonSet pods with new pods. Can be RollingUpdate or OnDelete.
## @param updateStrategy.rollingUpdate.maxUnavailable Max unavailable pods during update. Can be a number or a percentage.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

## @param readinessProbe.initialDelaySeconds Initial delay seconds for the readiness probe
## @param readinessProbe.periodSeconds How often to check that the filesystem is still mounted
## @param readinessProbe.timeoutSeconds Timeout value in seconds for the readiness probe
## The probe checks that the filesystem is actually mounted, so that a Ready pod means a usable mount.
readinessProbe:
  initialDelaySeconds: 2
  periodSeconds: 5
  timeoutSeconds: 2

## @param resources [object] Resource requests and limits for spiffefs
resources: {}

## @param extraEnvVars [array] Extra environment variables to be added to the spiffefs container
extraEnvVars: []

## @param initContainers [array] Init containers to add to the spiffefs DaemonSet
initContainers: []

## @param extraContainers [array] Extra containers to add to the spiffefs DaemonSet
extraContainers: []

## @param extraVolumes [array] Extra volumes to add to the spiffefs DaemonSet
extraVolumes: []

## @param extraVolumeMounts [array] Extra volume mounts to add to the spiffefs container
extraVolumeMounts: []

## @param imagePullSecrets [array] Image pull secret details for spiffefs
imagePullSecrets: []

## @param nameOverride Name override for spiffefs
nameOverride: ""

## @param fullnameOverride Full name override for spiffefs
fullnameOverride: ""

## @param namespaceOverride Namespace to install spiffefs into
namespaceOverride: ""

## @param serviceAccount.create Specifies whether a service account should be created
## @param serviceAccount.annotations Annotations to add to the service account
## @param serviceAccount.name The name of the service account to use. If not set and create is true, a name is generated.
##
serviceAccount:
  create: true
  annotations: {}
  name: ""

## @param podAnnotations [object] Pod annotations for spiffefs
podAnnotations: {}

## @param podLabels [object] Labels to add to pods
podLabels: {}

## @param securityContext [object] Security context for the spiffefs container. Mounting FUSE and reading caller pids requires privileged and root.
securityContext:
  privileged: true
  runAsUser: 0
  runAsGroup: 0
  readOnlyRootFilesystem: true

## @param nodeSelector [object] Node selector for spiffefs pods
nodeSelector: {}

## @param tolerations [array] Tolerations for spiffefs pods
tolerations: []

## @param affinity [object] Node affinity
affinity: {}

## @param priorityClassName Priority class assigned to daemonset pods. Can be auto set with global.recommendations.priorityClassName.
priorityClassName: ""
