{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "spiffefs.serviceAccountName" . | quote }}
  namespace: {{ include "spiffefs.namespace" . | quote }}
  labels:
    {{- include "spiffefs.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
