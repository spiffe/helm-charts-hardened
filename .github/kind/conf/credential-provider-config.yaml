# Kubelet image credential provider configuration, mounted into every kind worker by
# kind-config.yaml and staged by .github/scripts/install-image-cred-provider.sh.
#
# Only the bottom-turtle-ha test registry matches, so on every other example the provider
# is registered but never executed. It still has to be listed here, with its binary
# present and executable, or kubelet refuses to start at all.
#
# The plugin trades the pod's projected service account token plus the node's own
# JWT-SVID for a registry token from the SPIRE Identity Exchange. It reaches the exchange
# over the combined endpoint fronting both HA sides, and authenticates it by SPIFFE ID
# rather than a CA file, so the pull keeps working when one side is down.
apiVersion: kubelet.config.k8s.io/v1
kind: CredentialProviderConfig
providers:
  - name: k8s-image-cred-spire-identity-exchange
    matchImages:
      - "zot.production.other"
    defaultCacheDuration: "0s"
    apiVersion: credentialprovider.kubelet.k8s.io/v1
    args:
      - "--username=zot"
      - "--mode=spire-identity-exchange"
      - "--url=https://spire-identity-exchange-rest-spiffe.production.other"
      - "--stack=image_pull"
      - "--registry-audience=zot"
      - "--spiffe-audience=spire-identity-exchange"
      # Two entries share this node's socat bridge, split by hint. Without this the
      # plugin would take whichever the workload API returned first.
      - "--spiffe-hint=image-pull"
      - "--spiffe-id=spiffe://production.other/service/spire-identity-exchange"
      - "--timeout=10s"
    env:
      # The host spire-ha-agent's merged workload API, bridged per virtual node.
      - name: SPIFFE_ENDPOINT_SOCKET
        value: unix:///var/run/spiffe/socat/unix/k8s-kubelet/public/api.sock
    tokenAttributes:
      serviceAccountTokenAudience: "spire-identity-exchange"
      cacheType: "Token"
      requireServiceAccount: true
