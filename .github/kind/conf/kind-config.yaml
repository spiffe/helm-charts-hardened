kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
kubeadmConfigPatches:
  - |
    apiVersion: kubeadm.k8s.io/v1beta2
    kind: ClusterConfiguration
    metadata:
      name: config
    apiServer:
      extraArgs:
        service-account-key-file: /etc/kubernetes/pki/sa.pub
        service-account-signing-key-file: /etc/kubernetes/pki/sa.key
        service-account-issuer: api,spire-agent
        api-audiences: api,spire-server
        # admission-control-config-file: /etc/kubernetes/pki/admctrl/admission-control.yaml
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /var/run/spiffe/socat/unix/k8s-spire-server-a/public
        containerPath: /var/run/spiffe/socat/unix/k8s-spire-server-a/public
      - hostPath: /var/run/spiffe/socat/unix/k8s-spire-server-b/public
        containerPath: /var/run/spiffe/socat/unix/k8s-spire-server-b/public
  - role: worker
    extraMounts:
      - hostPath: /var/run/spiffe/socat/unix/k8s-spire-server-a/public
        containerPath: /var/run/spiffe/socat/unix/k8s-spire-server-a/public
      - hostPath: /var/run/spiffe/socat/unix/k8s-spire-server-b/public
        containerPath: /var/run/spiffe/socat/unix/k8s-spire-server-b/public
      - hostPath: /var/run/spiffe/socat/unix/k8s-spire-agent-2-a/public
        containerPath: /var/run/spiffe/socat/unix/k8s-spire-agent-a/public
      - hostPath: /var/run/spiffe/socat/unix/k8s-spire-agent-2-b/public
        containerPath: /var/run/spiffe/socat/unix/k8s-spire-agent-b/public
      # The host spire-ha-agent's merged workload API. One bridge per virtual node, so
      # each node's kubelet resolves to its own identity even though they share an agent.
      - hostPath: /var/run/spiffe/socat/unix/k8s-kubelet-2/public
        containerPath: /var/run/spiffe/socat/unix/k8s-kubelet/public
      - hostPath: ./.github/kind/conf/credential-providers
        containerPath: /credential-plugins
      - hostPath: ./.github/kind/conf/credential-provider-config.yaml
        containerPath: /etc/kubernetes/credential-provider-config.yaml
    kubeadmConfigPatches:
      # No apiVersion, so this matches whichever kubeadm version kind generates.
      # NOTE: kubeletExtraArgs is a map in v1beta3 (k8s < 1.36) and a list of
      # {name, value} in v1beta4. Convert this when the matrix reaches 1.36.
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            image-credential-provider-config: /etc/kubernetes/credential-provider-config.yaml
            image-credential-provider-bin-dir: /credential-plugins
  - role: worker
    extraMounts:
      - hostPath: /var/run/spiffe/socat/unix/k8s-spire-server-a/public
        containerPath: /var/run/spiffe/socat/unix/k8s-spire-server-a/public
      - hostPath: /var/run/spiffe/socat/unix/k8s-spire-server-b/public
        containerPath: /var/run/spiffe/socat/unix/k8s-spire-server-b/public
      - hostPath: /var/run/spiffe/socat/unix/k8s-spire-agent-3-a/public
        containerPath: /var/run/spiffe/socat/unix/k8s-spire-agent-a/public
      - hostPath: /var/run/spiffe/socat/unix/k8s-spire-agent-3-b/public
        containerPath: /var/run/spiffe/socat/unix/k8s-spire-agent-b/public
      - hostPath: /var/run/spiffe/socat/unix/k8s-kubelet-3/public
        containerPath: /var/run/spiffe/socat/unix/k8s-kubelet/public
      - hostPath: ./.github/kind/conf/credential-providers
        containerPath: /credential-plugins
      - hostPath: ./.github/kind/conf/credential-provider-config.yaml
        containerPath: /etc/kubernetes/credential-provider-config.yaml
    kubeadmConfigPatches:
      # No apiVersion, so this matches whichever kubeadm version kind generates.
      # NOTE: kubeletExtraArgs is a map in v1beta3 (k8s < 1.36) and a list of
      # {name, value} in v1beta4. Convert this when the matrix reaches 1.36.
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            image-credential-provider-config: /etc/kubernetes/credential-provider-config.yaml
            image-credential-provider-bin-dir: /credential-plugins
  - role: worker
    extraMounts:
      - hostPath: /var/run/spiffe/socat/unix/k8s-spire-server-a/public
        containerPath: /var/run/spiffe/socat/unix/k8s-spire-server-a/public
      - hostPath: /var/run/spiffe/socat/unix/k8s-spire-server-b/public
        containerPath: /var/run/spiffe/socat/unix/k8s-spire-server-b/public
      - hostPath: /var/run/spiffe/socat/unix/k8s-spire-agent-4-a/public
        containerPath: /var/run/spiffe/socat/unix/k8s-spire-agent-a/public
      - hostPath: /var/run/spiffe/socat/unix/k8s-spire-agent-4-b/public
        containerPath: /var/run/spiffe/socat/unix/k8s-spire-agent-b/public
      - hostPath: /var/run/spiffe/socat/unix/k8s-kubelet-4/public
        containerPath: /var/run/spiffe/socat/unix/k8s-kubelet/public
      - hostPath: ./.github/kind/conf/credential-providers
        containerPath: /credential-plugins
      - hostPath: ./.github/kind/conf/credential-provider-config.yaml
        containerPath: /etc/kubernetes/credential-provider-config.yaml
    kubeadmConfigPatches:
      # No apiVersion, so this matches whichever kubeadm version kind generates.
      # NOTE: kubeletExtraArgs is a map in v1beta3 (k8s < 1.36) and a list of
      # {name, value} in v1beta4. Convert this when the matrix reaches 1.36.
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            image-credential-provider-config: /etc/kubernetes/credential-provider-config.yaml
            image-credential-provider-bin-dir: /credential-plugins
